<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Lead360</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#FAFAF9;--panel:#FFFFFF;--panel-2:#F4F4F2;
 --sidebar:#111111;--sidebar-text:#C4C0BB;--sidebar-text-active:#FFFFFF;--sidebar-hover:#1F1F1F;
 --border:#E8E6E3;--border-strong:#D4D1CC;
 --text:#0F0F0F;--text-muted:#6B6660;--text-subtle:#9A948E;
 --primary:#EA5400;--primary-soft:rgba(234,84,0,.08);--primary-press:#CC4900;
 --success:#0E7C5A;--warn:#B8710A;--danger:#B42318;--info:#175CD3;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
 -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;
 font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .12s}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-press)}
.btn-secondary{background:var(--panel);border-color:var(--border-strong);color:var(--text)}.btn-secondary:hover{background:var(--panel-2)}
.btn-ghost{background:transparent;color:var(--text-muted)}.btn-ghost:hover{color:var(--text);background:var(--panel-2)}
.btn-danger{background:var(--panel);border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border:1px solid var(--border);
 border-radius:4px;background:var(--panel);color:var(--text);font-size:12px;font-weight:500}
.pill .dot{width:6px;height:6px;border-radius:50%}

/* login-specific */
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.brand .mark{width:32px;height:32px;border-radius:6px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.brand .word{font-weight:600;font-size:20px}
.auth h1{font-size:22px;font-weight:600;text-align:center;margin-bottom:6px}
.auth .sub{font-size:14px;color:var(--text-muted);text-align:center;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--panel);
 font:inherit;font-size:14px;color:var(--text)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.link{font-size:13px;color:var(--primary);cursor:pointer}.link:hover{opacity:.8}
.check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer}
.check input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--text-subtle)}
</style>
</head>
<body>
<main class="wrap">
  <section class="auth" aria-label="Sign in">
    <div class="brand">
      <span class="mark">L</span>
      <span class="word">Lead360</span>
    </div>
    <div class="card" style="padding:32px">
      <h1>Sign in to Lead360</h1>
      <p class="sub">Riseup Labs proposal &amp; budget studio</p>
      <form onsubmit="return false">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@riseuplabs.com" data-testid="login-email" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="••••••••" data-testid="login-password" autocomplete="current-password">
        </div>
        <div class="row-between">
          <label class="check" for="remember"><input type="checkbox" id="remember" data-testid="login-remember"> Remember me</label>
          <button type="button" class="link" data-testid="login-forgot" onclick="document.getElementById('forgot-note').hidden=!document.getElementById('forgot-note').hidden" style="background:none;border:none;font:inherit;cursor:pointer;padding:0">Forgot password?</button>
        </div>
        <p id="forgot-note" data-testid="login-forgot-note" hidden style="font-size:12.5px;color:var(--text-muted);background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin-bottom:14px;line-height:1.5">Accounts are managed by your Riseup Labs administrator. Contact your admin to reset your password.</p>
        <a class="btn btn-primary" href="leads.page.html" style="width:100%" data-testid="login-submit">Sign in</a>
      </form>
    </div>
    <p class="foot">Riseup Labs internal · Access is restricted to staff accounts.</p>
  </section>
</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons()</script>
</body>
</html>
