<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Lead360</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#FAFAF9;--panel:#FFFFFF;--panel-2:#F4F4F2;
 --sidebar:#111111;--sidebar-text:#C4C0BB;--sidebar-text-active:#FFFFFF;--sidebar-hover:#1F1F1F;
 --border:#E8E6E3;--border-strong:#D4D1CC;
 --text:#0F0F0F;--text-muted:#6B6660;--text-subtle:#9A948E;
 --primary:#EA5400;--primary-soft:rgba(234,84,0,.08);--primary-press:#CC4900;
 --success:#0E7C5A;--warn:#B8710A;--danger:#B42318;--info:#175CD3;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
 -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;
 font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .12s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-press)}
.btn-secondary{background:var(--panel);border-color:var(--border-strong);color:var(--text)}.btn-secondary:hover{background:var(--panel-2)}

.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.nf{text-align:center;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand .word{font-weight:600;font-size:18px}
.nf .code{font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em}
.nf h1{font-size:22px;font-weight:600;margin:14px 0 8px}
.nf p{font-size:14px;color:var(--text-muted);margin-bottom:26px}
.actions{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<main class="wrap">
  <section class="nf" aria-label="Page not found">
    <div class="brand">
      <span class="mark">L</span>
      <span class="word">Lead360</span>
    </div>
    <div class="code num">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="leads.page.html" data-testid="notfound-leads">Back to leads</a>
    </div>
  </section>
</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons()</script>
</body>
</html>
